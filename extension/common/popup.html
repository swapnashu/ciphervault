<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="/icons/32.png" alt="">
    <b>CipherVault</b>
    <span id="state-hint"></span>
  </header>

  <!-- 1. Signed out -->
  <div id="screen-login" hidden>
    <div class="row">
      <input id="login-email" type="email" placeholder="Email" autocomplete="off" spellcheck="false">
    </div>
    <div class="row">
      <input id="login-password" type="password" placeholder="Master password">
    </div>
    <button id="btn-login" class="primary">Sign in</button>
    <p id="login-error" class="error" hidden></p>
    <p class="hint">Session stays in browser memory only — it clears when the browser closes.</p>
  </div>

  <!-- 2. Save banner -->
  <div id="screen-save" hidden>
    <div class="save-banner">
      <div><b>Save this login?</b></div>
      <div id="save-summary" class="mono"></div>
      <input id="save-title" type="text" placeholder="Name (defaults to the site)">
      <div class="btns">
        <button id="btn-save" class="primary">Save</button>
        <button id="btn-discard" class="ghost">Ignore</button>
      </div>
    </div>
  </div>

  <!-- 3. Entry list for this site -->
  <div id="screen-entries" hidden>
    <div id="entries-list"></div>
    <p id="entries-none" class="hint" hidden></p>
  </div>

  <footer>
    <span id="foot-rev"></span>
    <button id="btn-logout" class="ghost small" hidden>Lock</button>
    <span class="spacer"></span>
    <span class="muted">CipherVault Add-on</span>
  </footer>

  <script src="crypto.js"></script>
  <script src="api.js"></script>
  <script src="domains.js"></script>
  <script src="popup.js"></script>
</body>
</html>
